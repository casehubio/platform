playbook: "1.0"
schema: client
---
meta:
  title: "Timed Absence"
  description: "A then !B[window] — detect the absence of an event within a time window. The timeout firing means the expected event did NOT arrive."
  tags:
    - temporal
    - absence
    - timeout
    - from
    - composition
---
- log: { message: "Event A detected — watching for B within 5s" }

- block:
  - step: watch-for-b
    log: { message: "Event B arrived: ${from.type}" }
    from: events
    timeout: 5s

- log: { message: "Window closed — absence check complete" }
