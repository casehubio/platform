# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
playbook: signal-await-demo
meta:
  title: "Signal / Await"
  description: "One-way dependency between branches. Sender signals after a click, receiver blocks until the signal arrives."
  tags:
    - signal
    - await
    - concurrent
    - coordination
  level: 3
  layer: coordination
  teaches: "signalling between steps"
  builds-on: sequential
---
- concurrent:
    sender:
      - click: "A"
      - signal: go
    receiver:
      - await:signal: go
      - click: "B"
