name: Playbook catalog parsing gate
steps:
  - validate-playbook:
      directory: ../../main/playbooks
    capture: result
  - assertThat: result.validatedCount
    greaterThan: 60
  - assertThat: result.errors
    hasSize: 3
    message: "Expected failures: modules.playbook.yaml (import deser), rest.playbook.yaml (headers sibling key), 08-structured-output.yaml (response-format sibling key)"
