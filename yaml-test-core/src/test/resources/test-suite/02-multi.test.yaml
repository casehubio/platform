name: Multi-test file

setup:
  - emit-event: test.init

tests:
  - name: First test
    steps:
      - agent-invoke "risk":
        capture: result
      - assertThat: ${result.text}
        contains: 'risk'

  - name: Second test
    setup:
      - emit-event: test.per-test-setup
    steps:
      - agent-invoke "rebalance":
        capture: result
      - assertThat: ${result.text}
        contains: 'rebalance'
    teardown:
      - emit-event: test.per-test-teardown

teardown:
  - emit-event: test.destroy
