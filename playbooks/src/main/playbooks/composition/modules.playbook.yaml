playbook: "1.0"
schema: client
---
playbook: modules-demo
meta:
  title: "Modules"
  description: "Reusable composition via parameterised blocks. Three imports of a status-panel template — each stamped with its own alias and parameters. Outputs chain between imports."
  tags:
    - module
    - imports
    - parameters
    - outputs
    - composition
  level: 3
  layer: composition
  teaches: "reusable module definitions and imports"
  builds-on: block-sequential

imports:
  - module: status-panel
    as: sales
    parameters:
      title: "Sales Overview"
      dataset: sales-daily
      threshold: "90"
  - module: status-panel
    as: ops
    parameters:
      title: "Operations"
      dataset: ops-metrics
  - module: status-panel
    as: combined
    condition: "${module.sales.panelId}"
    parameters:
      title: "Combined View"
      dataset: "${module.ops.panelId}-feed"
---
- log: "Sales panel: ${module.sales.panelId}"
- log: "Ops panel: ${module.ops.panelId}"
- log: "Combined panel: ${module.combined.panelId}"
