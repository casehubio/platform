# Baseline parent-first loading for platform API types.
# Prevents classloader split when platform-api types are loaded by both the
# Quarkus application classloader and the parent classloader in @QuarkusTest.
# Consumers that override parent-first-artifacts in their own application.properties
# must include casehub-platform-api in their list (MicroProfile Config replaces,
# not merges, across priority levels).
quarkus.class-loading.parent-first-artifacts=io.casehub:casehub-platform-api
