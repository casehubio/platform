playbook: "1.0"
schema: client
---
meta:
  title: "Pool Backed"
  description: "05 — Pool-Backed Sessions Builds on 02: sessions are backed by a named pool declared inline. The pool manages session lifecycle — checkout, reuse, and eviction. Requires agent-config.yaml manifest (see companion file)."
  tags: []
  level: 4
  layer: agent-interaction-patterns
  teaches: "agent pool infrastructure"
  builds-on: 01-direct-invoke
pools:
  analysts:
    agent-id: financial-analyst
    backend: claude
    max-active: 5
    clearing:
      policy: size-aware
      threshold: 8000
---
- agent-session-open analyst-1:
      pool: analysts
      system: "You are a senior financial analyst specializing in equity markets."

- agent-query analyst-1: "What are the key indicators for tech sector performance in Q4?"
  capture: q4_outlook

- agent-query analyst-1: "Which specific stocks would you watch based on those indicators?"
  capture: stock_picks

- agent-session-close: analyst-1
