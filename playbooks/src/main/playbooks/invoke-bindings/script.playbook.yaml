playbook: "1.0"
schema: client
---
meta:
  title: "Script"
  description: "Script binding — execute an inline script in a specified runtime (python3, node). The mock executor simulates running a Python data-processing script and a Node.js validation script."
  tags:
    - script
    - inline
    - runtime
    - invoke-bindings
---
- script-run:python3: "import json; print(json.dumps({'status': 'ok'}))"
  timeout: 30s
- log: "Python script done"
- script-run:node: "console.log(JSON.stringify({ valid: true }))"
  timeout: 10s
- log: "Node script done"
