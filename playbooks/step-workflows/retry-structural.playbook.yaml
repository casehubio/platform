playbook: "1.0"
schema: client
---

playbook: retry-structural-demo
meta:
  title: "Retry (structural)"
  description: "Structural retry wraps multiple steps — the entire group retries on failure. Compare with the decorator form which retries a single step."
  tags:
    - retry
    - structural
    - block
    - step-workflows
---
# ── structural form: retry wraps child steps ──
# "retry 3" is the YAML key; the steps array is its value.
# Equivalent to: block: [...] + retry: 3
- retry 3:
    - click: { role: button, name: "A" }
    - click: { role: button, name: "B" }

# ── decorator form (unchanged): retry on a single step ──
- click: { role: button, name: "C" }
  retry: 3
