# Test configuration for notifications REST + SSE

# Use in-memory notification store for tests
# (InMemoryNotificationStore + InMemoryReactiveNotificationStore are @Alternative @Priority(100))

# FixedCurrentPrincipal from casehub-platform-testing is @Alternative @Priority(200)
# and beats all other CurrentPrincipal implementations in tests

# CDI index dependencies for test-scoped platform modules
quarkus.index-dependency.notification-dispatch.group-id=io.casehub
quarkus.index-dependency.notification-dispatch.artifact-id=casehub-platform-notification-dispatch
quarkus.index-dependency.notification-settings-inmem.group-id=io.casehub
quarkus.index-dependency.notification-settings-inmem.artifact-id=casehub-platform-notification-settings-inmem
