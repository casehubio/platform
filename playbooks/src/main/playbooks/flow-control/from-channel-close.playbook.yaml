playbook: "1.0"
schema: client
---
meta:
  title: "From Channel Close"
  description: "from: with channel close detection — the consumer exits cleanly when the producer closes the channel. Error-close propagates the failure."
  tags:
    - from
    - channel
    - close
    - flow-control
  level: 3
  layer: flow-control
  teaches: "consuming from a channel until it closes"
  builds-on: [loop, channel]
steps:
  - concurrent:
      producer:
        - log: "Sending item 1"
          publish: { channel: data, data: { id: 1 } }
        - log: "Sending item 2"
          publish: { channel: data, data: { id: 2 } }
        - log: "Closing channel"

      consumer:
        - name: read
          log: "Received ${from.id}"
          from: data
          loop: continuous
          cancel: shutdown
