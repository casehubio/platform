name: Agent example playbook compilation
tests:
  - name: "01-direct-invoke compiles with 3 steps"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/01-direct-invoke.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.stepNames
        hasSize: 3
        message: "invoke + two queries = 3 compiled tasks"

  - name: "02-session-conversation compiles with 5 steps"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/02-session-conversation.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.stepNames
        hasSize: 5
        message: "open + 3 queries + close = 5 compiled tasks"

  - name: "03-session-with-clear includes clear step"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/03-session-with-clear.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.hasClearStep
        equals: true

  - name: "04-parallel-queries includes fork block"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/04-parallel-queries.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.hasFork
        equals: true

  - name: "05-pool-backed parses inline pool"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/05-pool-backed.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.poolDeclarations
        hasSize: 1
      - assertThat: output.pools.analysts.name
        equals: "analysts"
      - assertThat: output.pools.analysts.maxActive
        equals: 5

  - name: "06-multi-channel compiles successfully"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/06-multi-channel.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.poolDeclarations
        hasSize: 2
        message: "support and sales channels each have a pool"

  - name: "07-salience-priority parses three pools"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/07-salience-priority.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.poolDeclarations
        hasSize: 3
      - assertThat: output.pools.voice.salience
        equals: 2
      - assertThat: output.pools.email.salience
        equals: 0

  - name: "08-structured-output compiles successfully"
    steps:
      - validate-playbook: ../../../main/playbooks/agent-interaction-patterns/08-structured-output.playbook.yaml
        capture: output
      - assertThat: output.valid
        equals: true
      - assertThat: output.poolDeclarations
        hasSize: 1
        message: "extractors pool declared for data extraction"
