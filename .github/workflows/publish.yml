name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Bootstrap API dependencies for coordinated releases
        run: python3 .github/scripts/bootstrap-release-apis.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: mvn --batch-mode --fail-at-end install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy parent POM
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode deploy -DskipTests -N || echo "::warning::Parent POM already deployed (409), continuing with modules"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish modules to GitHub Packages
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode deploy -DskipTests -rf :casehub-platform-playbook-catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger downstream CI
        if: github.event_name != 'pull_request' && success()
        run: |
          for repo in parent ledger connectors eidos neural-text casehub-worker work qhorus engine devtown aml clinical claudony; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
