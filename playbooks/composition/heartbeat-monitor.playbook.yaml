playbook: "1.0"
schema: client
---
meta:
  title: "Heartbeat Monitor"
  description: "Periodic absence check — loop continuously, reading heartbeats with a timeout. A timeout means the heartbeat was missed."
  tags:
    - temporal
    - heartbeat
    - monitor
    - loop
    - from
    - timeout
    - composition
---
- step: monitor
  block:
    - step: heartbeat
      log: { message: "Heartbeat: ${from.ts}" }
      from: heartbeats
      timeout: 5s
    - delay: 1s
  loop: continuous
  cancel: shutdown
