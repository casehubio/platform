# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
playbook: mixed-delivery-demo
meta:
  title: "Mixed Delivery"
  description: "Scenarios can mix delivery types. Simulated steps inject data while ARIA steps interact with UI — they compose naturally in concurrent branches."
  tags:
    - simulated
    - click
    - concurrent
    - mixed
    - data-delivery
  level: 4
  layer: data-delivery
  teaches: "combining multiple data sources"
  builds-on: [simulated-data, graphql-operation]
---
- concurrent:
    data-pump:
      - simulated:
          dataset: events
          data:
            type: login
            user: alice
      - delay: 500ms
      - simulated:
          dataset: events
          data:
            type: purchase
            user: alice
            amount: 49.99
    ui-flow:
      - click: "Submit"
      - delay: 800ms
      - click: "Reset"
