playbook: "1.0"
schema: client
---
meta:
  title: "Process"
  description: "Process binding — execute an OS process. The mock executor simulates running ls and git status commands, capturing stdout and exit codes."
  tags:
    - process
    - os
    - command
    - invoke-bindings
---
- process-exec ls: [-la, src/]
  output: stdout
  timeout: 10s
- log: "Directory listed"
- process-exec git: [status, --short]
  output: stdout
- log: "Git status captured"
