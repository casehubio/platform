# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
meta:
  title: "Agent"
  description: "Agent binding — delegate work to an AI agent. The mock executor simulates dispatching a summarisation task and a code-generation task, returning structured output."
  tags:
    - agent
    - delegation
    - llm
    - invoke-bindings
  level: 3
  layer: invoke-bindings
  teaches: "invoking an agent backend"
  builds-on: sequential
---
- agent-delegate summarizer:
    model: claude-sonnet-5
    structuredOutput: true
    params: { text: "Long document content...", maxLength: 100 }
- log: "Summary generated"
- agent-delegate code-gen:
    model: claude-opus-5
    structuredOutput: true
    params: { spec: "REST endpoint for user CRUD" }
- log: "Code generated"
