name: Composition category validation
steps:
  - validate-playbook:
      directory: ../../../main/playbooks/composition
    capture: result
  - assertThat: result.validatedCount
    equals: 9
    message: "all 9 composition playbooks are discovered"
  - assertThat: result.errors
    hasSize: 0
    message: "all composition playbooks compile without errors"
  - assertThat: result.headerErrors
    hasSize: 0
    message: "all composition playbooks have tutorial headers"
