spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health
spring.autoconfigure.exclude=io.casehub.platform.spring.rest.RestControllersAutoConfiguration,io.casehub.platform.callback.spring.CallbackSpringAutoConfiguration,io.casehub.platform.mcp.spring.McpSpringAutoConfiguration
