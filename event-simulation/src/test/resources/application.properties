# Disable scheduled tick in tests
casehub.simulation.event.interval=OFF

# Index simulation-config JAR for CDI bean discovery
quarkus.index-dependency.simulation-config.group-id=io.casehub
quarkus.index-dependency.simulation-config.artifact-id=casehub-platform-simulation-config

# Index expression JAR for CDI bean discovery (test-scope, provides ExpressionEngineRegistry)
quarkus.index-dependency.expression.group-id=io.casehub
quarkus.index-dependency.expression.artifact-id=casehub-platform-expression
