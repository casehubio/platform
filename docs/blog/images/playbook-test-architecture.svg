<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- src/main/playbooks box -->
  <rect x="30" y="30" width="300" height="260" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="180" y="55" text-anchor="middle" font-weight="600" fill="#166534" font-size="14">src/main/playbooks/</text>

  <!-- Playbook file -->
  <rect x="50" y="75" width="260" height="40" rx="4" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="65" y="100" fill="#1e3a29" font-size="12">01-direct-invoke.yaml</text>
  <text x="295" y="100" text-anchor="end" fill="#6b7280" font-size="10">playbook</text>

  <!-- agent-config -->
  <rect x="50" y="125" width="260" height="40" rx="4" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="65" y="150" fill="#1e3a29" font-size="12">agent-config.yaml</text>
  <text x="295" y="150" text-anchor="end" fill="#6b7280" font-size="10">manifest</text>

  <!-- simulation.yaml -->
  <rect x="50" y="175" width="260" height="40" rx="4" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="65" y="200" fill="#1e3a29" font-size="12">simulation.yaml</text>
  <text x="295" y="200" text-anchor="end" fill="#6b7280" font-size="10">corpus</text>

  <!-- More playbooks indicator -->
  <text x="180" y="250" text-anchor="middle" fill="#9ca3af" font-size="11">70+ playbooks across 9 categories</text>
  <text x="180" y="270" text-anchor="middle" fill="#9ca3af" font-size="11">flow-control | coordination | concurrency | ...</text>

  <!-- src/test/playbooks box -->
  <rect x="390" y="30" width="300" height="160" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="540" y="55" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="14">src/test/playbooks/</text>

  <!-- Test file -->
  <rect x="410" y="75" width="260" height="55" rx="4" fill="white" stroke="#bfdbfe" stroke-width="1"/>
  <text x="425" y="95" fill="#1e3a8a" font-size="12">01-direct-invoke.test.yaml</text>
  <text x="425" y="115" fill="#6b7280" font-size="10">run-playbook: 01-direct-invoke.yaml</text>

  <!-- Assertion -->
  <rect x="410" y="140" width="260" height="35" rx="4" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="425" y="163" fill="#854d0e" font-size="11">assertThat: result.output.classification</text>

  <!-- Mirror arrow -->
  <line x1="345" y1="100" x2="398" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="372" y="90" text-anchor="middle" fill="#6b7280" font-size="9">mirror</text>

  <!-- Runtime box -->
  <rect x="390" y="230" width="300" height="160" rx="6" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="540" y="255" text-anchor="middle" font-weight="600" fill="#9d174d" font-size="14">Test Engine (runtime)</text>

  <!-- Engine steps -->
  <text x="410" y="280" fill="#831843" font-size="11">1. Discover .test.yaml via @Suite</text>
  <text x="410" y="300" fill="#831843" font-size="11">2. Read agent-config.yaml (manifest)</text>
  <text x="410" y="320" fill="#831843" font-size="11">3. API key present? Real LLM : simulation</text>
  <text x="410" y="340" fill="#831843" font-size="11">4. Auto-discover simulation.yaml (corpus)</text>
  <text x="410" y="360" fill="#831843" font-size="11">5. Execute playbook, capture outputs</text>
  <text x="410" y="380" fill="#831843" font-size="11">6. Assert on behavioural results</text>

  <!-- Arrows from main to runtime -->
  <path d="M180,290 Q280,350 385,310" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="4,3"/>
  <text x="260" y="325" fill="#059669" font-size="9">auto-discover</text>

  <!-- Arrow from test to runtime -->
  <line x1="540" y1="195" x2="540" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumers label -->
  <rect x="30" y="330" width="300" height="65" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="180" y="355" text-anchor="middle" font-weight="600" fill="#6b21a8" font-size="12">Also consumed by</text>
  <text x="180" y="375" text-anchor="middle" fill="#7c3aed" font-size="11">Pages showcase gallery (tutorials)</text>
</svg>
