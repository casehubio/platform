playbook: "1.0"
schema: client
---

playbook: orchestration-block-demo
meta:
  title: "Orchestration Block"
  description: "Top-level orchestration block pre-declares barriers and signals. Init delays then signals, worker awaits, both sync at a barrier before proceeding."
  tags:
    - orchestration block
    - signal
    - await
    - barrier
    - delay
    - concurrent
    - composition
orchestration:
  barriers:
    sync: { count: 2 }
  signals: [ready]
---
- concurrent:
    init:
      - click: "A"
      - delay: 1500ms
      - signal: ready
      - await:barrier: sync
      - click: "C"
    worker:
      - await:signal: ready
      - click: "B"
      - await:barrier: sync
      - click: "D"
