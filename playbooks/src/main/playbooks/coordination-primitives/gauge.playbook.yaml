playbook: "1.0"
schema: client
---
meta:
  title: "Gauge"
  description: "Typed value holder with atomic compare-and-set. Unlike a counter, a gauge holds any value — use it for temperatures, levels, thresholds."
  tags:
    - gauge
    - value
    - compare-and-set
    - coordination-primitives
---
- gauge-set temp: 20
- gauge-get: "temp"
- gauge-set temp: 35
- gauge-get: "temp"
- gauge-cas temp: { expect: 35, update: 42 }
- gauge-get: "temp"
