# 02 — Session Conversation
# Builds on 01: multiple queries to the same session.
# The session preserves context between turns, so the agent remembers
# what was discussed earlier.

steps:
  - agent-session-open analyst:
      system: >
        You are a financial analyst. Answer questions about the portfolio
        provided. Be concise.

  - agent-query analyst: "The portfolio has 60% equities, 30% bonds, 10% cash. What's the risk profile?"
    capture: risk_assessment

  - agent-query analyst: "Given that risk profile, what rebalancing would you suggest for a downturn?"
    capture: rebalancing_advice

  - agent-query analyst: "Summarize your recommendations in three bullet points."
    capture: summary

  - agent-session-close: analyst
