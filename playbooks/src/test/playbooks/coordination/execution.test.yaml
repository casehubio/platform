name: Coordination category validation
steps:
  - validate-playbook:
      directory: ../../../main/playbooks/coordination
    capture: result
  - assertThat: result.validatedCount
    equals: 4
    message: "all 4 coordination playbooks are discovered"
  - assertThat: result.errors
    hasSize: 0
    message: "all coordination playbooks compile without errors"
  - assertThat: result.headerErrors
    hasSize: 0
    message: "all coordination playbooks have tutorial headers"
