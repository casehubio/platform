name: Multi-test basics

tests:
  - name: First invocation
    steps:
      - agent-invoke:
          prompt: "hello"
        capture: result
      - assertThat: ${result.text}
        not-empty: true

  - name: Second invocation
    steps:
      - agent-invoke:
          prompt: "world"
        capture: result
      - assertThat: ${result.text}
        contains: 'world'
