playbook: "1.0"
schema: client
---
meta:
  title: "From Until"
  description: "from: with exit condition — reads from a channel repeatedly until a flag is set. The until expression is evaluated before each receive."
  tags:
    - from
    - until
    - channel
    - flow-control
  level: 2
  layer: flow-control
  teaches: "iterating with a counter until a condition"
  builds-on: loop
---
- name: producer
  log: "Sending 3 items"
  publish: { channel: events, data: { value: 1 } }
  loop: 3

- name: consumer
  log: "Processing ${from.value}"
  from: { channel: events, until: "${flag.done}" }
  loop: continuous
  cancel: shutdown
