# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
meta:
  title: "Match / Cases"
  description: "Pattern matching with value, structural, any-of, and default patterns. The first matching case executes; later cases are skipped."
  tags:
    - match
    - pattern matching
    - cases
    - step-workflows
  level: 2
  layer: step-workflows
  teaches: "multi-branch pattern matching"
  builds-on: if-else
---
- match: "warning"
  cases:
    - pattern: "error"
      log: "Matched: error"
    - pattern: "warning"
      log: "Matched: warning"
    - default:
        - log: "No match — default"
