playbook: "1.0"
schema: client
---
meta:
  title: "Order Lifecycle"
  description: "Order lifecycle — three named steps drive a state machine through: pending → checked → paid → shipped"
  tags: []
  level: 4
  layer: simulation
  teaches: "state machine-driven simulation with corpus selection"
  builds-on: [state-machine, simulated-data]
steps:
  - agent-session-open order-agent:
      system: You are an order processing assistant.

  - name: check-order
    agent-query order-agent: "Check order status for ORD-5501"

  - name: process-payment
    agent-query order-agent: "Process payment for ORD-5501"

  - name: ship-order
    agent-query order-agent: "Ship order ORD-5501"

  - agent-session-close: order-agent
