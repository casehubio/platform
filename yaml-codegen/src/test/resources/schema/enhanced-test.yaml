$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  Event:
    type: object
    properties:
      name:
        type: string
      x-internal:
        type: string
      x-debug:
        type: boolean
      internal:
        type: string
      priority:
        type: integer
      tags:
        type: array
        items:
          type: string
