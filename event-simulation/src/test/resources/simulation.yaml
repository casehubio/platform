triggers:
  activate:
    event-type: "test.activate"
  complete:
    event-type: "test.complete"
  conditional-activate:
    event-type: "test.conditional"
    condition: "level > 5"

methods:
  test-spi.invoke:
    strategy: sequential
    corpus-selection:
      type: state-machine
      initial: idle
      transitions:
        idle:
          activate: active
          conditional-activate: active
        active:
          complete: done
      phases:
        idle:
          - output: "idle response"
        active:
          - output: "active response"
        done:
          - output: "done response"
