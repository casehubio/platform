playbook: "1.0"
schema: client
---
meta:
  title: "Direct Invoke"
  description: "01 — Direct Invoke Simplest pattern: a single-shot agent call with no session or pool. The agent receives a system prompt and user prompt, returns a response."
  tags: []
  level: 2
  layer: agent-interaction-patterns
  teaches: "single-shot agent invocation"
  builds-on: sequential
steps:
  - agent-session-open classifier:
      system: >
        You are a document classifier. Respond with exactly one word:
        INVOICE, CONTRACT, RECEIPT, or UNKNOWN.

  - agent-query classifier: "Classify this document: 'Payment of $5,000 due by March 15'"
    capture: classification

  - agent-session-close: classifier
