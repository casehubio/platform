playbook: "1.0"
schema: client
---
meta:
  title: "GraphQL"
  description: "GraphQL binding — execute a query or mutation against a GraphQL endpoint. The mock executor simulates a users query and a createUser mutation with realistic response shapes."
  tags:
    - graphql
    - query
    - mutation
    - invoke-bindings
  level: 3
  layer: invoke-bindings
  teaches: "executing GraphQL operations"
  builds-on: rest
steps:
  - graphql-exec: "{ users { id name email } }"
  - log: "Query executed"
  - graphql-exec: "mutation { createUser(name: \"Alice\") { id } }"
  - log: "Mutation executed"
