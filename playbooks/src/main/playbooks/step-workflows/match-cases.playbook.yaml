playbook: "1.0"
schema: client
---
meta:
  title: "Match / Cases"
  description: "Pattern matching with value, structural, any-of, and default patterns. The first matching case executes; later cases are skipped."
  tags:
    - match
    - pattern matching
    - cases
    - step-workflows
---
- match: "warning"
  cases:
    - pattern: "error"
      log: "Matched: error"
    - pattern: "warning"
      log: "Matched: warning"
    - default:
        - log: "No match — default"
