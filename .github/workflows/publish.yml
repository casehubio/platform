name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── PR path: parallel sliced build with tests ─────────────────────────
  #
  # Phase 0: base (3 modules, <1s)
  # Phase 1: slices A/B/C in parallel (60+57+53 modules)
  # Phase 2: convergence (39 modules, depends on all slices)
  #
  # Wall-clock: ~20 min vs ~46 min sequential.

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Bootstrap API dependencies for coordinated releases
        run: python3 .github/scripts/bootstrap-release-apis.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Phase 0: Build base"
        run: mvn install -T 1C -f aggregator-base.xml --batch-mode -ntp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Phase 1: Build slices A/B/C/D in parallel"
        run: |
          mvn install -T 1C -f aggregator-slice-a.xml --batch-mode --fail-at-end -ntp 2>&1 | sed 's/^/[A] /' &
          PID_A=$!
          mvn install -T 1C -f aggregator-slice-b.xml --batch-mode --fail-at-end -ntp 2>&1 | sed 's/^/[B] /' &
          PID_B=$!
          mvn install -T 1C -f aggregator-slice-c.xml --batch-mode --fail-at-end -ntp 2>&1 | sed 's/^/[C] /' &
          PID_C=$!
          mvn install -T 1C -f aggregator-slice-d.xml --batch-mode --fail-at-end -ntp 2>&1 | sed 's/^/[D] /' &
          PID_D=$!

          FAILED=0
          wait $PID_A || FAILED=$((FAILED + 1))
          wait $PID_B || FAILED=$((FAILED + 1))
          wait $PID_C || FAILED=$((FAILED + 1))
          wait $PID_D || FAILED=$((FAILED + 1))

          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED slice(s) failed"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 30

      - name: "Phase 2: Build convergence"
        run: mvn install -T 1C -f aggregator-convergence.xml --batch-mode --fail-at-end -ntp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 10

  # ── Push path: single-reactor deploy (no tests) ───────────────────────

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Bootstrap API dependencies for coordinated releases
        run: python3 .github/scripts/bootstrap-release-apis.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          mvn --batch-mode --fail-at-end deploy -DskipTests -ntp 2>&1 | tee /tmp/deploy.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -eq 0 ]; then exit 0; fi
          if grep -q "HTTP Status: 409" /tmp/deploy.log && ! grep -qE "Failures: [1-9]|Errors: [1-9]|COMPILATION ERROR" /tmp/deploy.log; then
            echo "::warning::Some artifacts already deployed (409) — expected for unchanged modules"
            exit 0
          fi
          exit $STATUS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger downstream CI
        if: success()
        run: |
          for repo in parent ledger connectors eidos neural-text casehub-worker work qhorus engine devtown aml clinical claudony; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
