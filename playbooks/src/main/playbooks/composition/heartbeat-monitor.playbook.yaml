playbook: "1.0"
schema: client
---
meta:
  title: "Heartbeat Monitor"
  description: "Periodic absence check — loop continuously, reading heartbeats with a timeout. A timeout means the heartbeat was missed."
  tags:
    - temporal
    - heartbeat
    - monitor
    - loop
    - from
    - timeout
    - composition
  level: 5
  layer: composition
  teaches: "detecting missed heartbeats via timed absence"
  builds-on: [timeout, concurrent]
steps:
  - block monitor:
      - name: heartbeat
        log: "Heartbeat: ${from.ts}"
        from: heartbeats
        timeout: 5s
      - delay: 1s
    loop: continuous
    cancel: shutdown
