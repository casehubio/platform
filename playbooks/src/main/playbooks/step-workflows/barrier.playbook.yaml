# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
meta:
  title: "Barrier"
  description: "A barrier blocks until all named steps have completed. Use it to express \"wait for A and B before proceeding.\""
  tags:
    - barrier
    - await
    - dependency
    - step-workflows
  level: 4
  layer: step-workflows
  teaches: "synchronisation point across branches"
  builds-on: parallel
---
- name: fetch-data
  log: "Fetching data"
- name: load-config
  log: "Loading config"
- barrier:
    await: [fetch-data, load-config]
- log: "Both done — proceeding"
