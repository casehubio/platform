playbook: "1.0"
schema: client
---

playbook: barrier-demo
meta:
  title: "Barrier"
  description: "N-way sync point. Three branches with staggered delays converge at a barrier — fast and medium block until slow arrives, then all proceed."
  tags:
    - barrier
    - await
    - delay
    - orchestration block
    - concurrent
    - coordination
orchestration:
  barriers:
    all-ready: { count: 3 }
---
- concurrent:
    fast:
      - click: "A"
      - await:barrier: all-ready
      - click: "D"
    medium:
      - click: "B"
      - delay: 1000ms
      - await:barrier: all-ready
      - click: "E"
    slow:
      - click: "C"
      - delay: 2000ms
      - await:barrier: all-ready
      - click: "F"
