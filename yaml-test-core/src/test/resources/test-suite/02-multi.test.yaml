name: Multi-test file

setup:
  - emit-event: test.init

teardown:
  - emit-event: test.destroy
---
name: First test
---
- agent-invoke "risk":
  capture: output
- assertThat: ${output.text}
  contains: 'risk'
---
name: Second test
setup:
  - emit-event: test.per-test-setup
teardown:
  - emit-event: test.per-test-teardown
---
- agent-invoke "rebalance":
  capture: output
- assertThat: ${output.text}
  contains: 'rebalance'
