playbook: "1.0"
schema: client
---
meta:
  title: "Latch"
  description: "Countdown latch — starts at N, each countDown() decrements by 1. When count reaches zero, all waiters are released. Unlike a barrier, a latch is one-shot: once tripped it stays open."
  tags:
    - latch
    - countdown
    - barrier
    - coordination-primitives
  level: 3
  layer: coordination-primitives
  teaches: "countdown latch for waiting on N events"
  builds-on: counter
steps:
  - latch-create init-gate: { count: 3 }
  - latch-countdown: "init-gate"
  - latch-status: "init-gate"
  - latch-countdown: "init-gate"
  - latch-countdown: "init-gate"
  - latch-status: "init-gate"
