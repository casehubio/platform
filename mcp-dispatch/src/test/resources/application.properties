# Index the test fixtures (@McpDomain resolvers, enrichers, report providers) shipped in the
# casehub-platform-mcp test-jar so the dispatch tools have domains to navigate.
quarkus.index-dependency.mcp-fixtures.group-id=io.casehub
quarkus.index-dependency.mcp-fixtures.artifact-id=casehub-platform-mcp
quarkus.index-dependency.mcp-fixtures.classifier=tests

# Class-based @McpDomain fixtures are only reached through BeanManager by the scanner; in the mcp
# module some tests inject them directly, here nothing does, so keep ArC from removing them.
quarkus.arc.unremovable-types=io.casehub.platform.mcp.ClassBasedDomainService,io.casehub.platform.mcp.DirectDomainImpl
