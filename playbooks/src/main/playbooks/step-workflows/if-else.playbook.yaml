# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
meta:
  title: "If / Else"
  description: "Conditional branching — evaluates a condition, runs then-steps if truthy, else-steps otherwise. Conditions use the truthiness evaluator."
  tags:
    - if
    - else
    - conditional
    - step-workflows
  level: 2
  layer: step-workflows
  teaches: "conditional branching with then/else"
  builds-on: sequential
---
- if: true
  then:
    - log: "Condition was true"
  else:
    - log: "Condition was false"
- if: false
  then:
    - log: "This is skipped"
  else:
    - log: "False branch taken"
