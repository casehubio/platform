name: Invoke bindings category validation
steps:
  - validate-playbook:
      directory: ../../../main/playbooks/invoke-bindings
    capture: result
  - assertThat: result.validatedCount
    equals: 6
    message: "all 6 invoke-bindings playbooks are discovered"
  - assertThat: result.errors
    hasSize: 0
    message: "all invoke-bindings playbooks compile without errors"
  - assertThat: result.headerErrors
    hasSize: 0
    message: "all invoke-bindings playbooks have tutorial headers"
