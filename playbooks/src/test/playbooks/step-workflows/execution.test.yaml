name: Step workflows category validation
steps:
  - validate-playbook:
      directory: ../../../main/playbooks/step-workflows
    capture: output
  - assertThat: output.validatedCount
    equals: 13
    message: "all 13 step-workflows playbooks are discovered"
  - assertThat: output.errors
    hasSize: 0
    message: "all step-workflows playbooks compile without errors"
  - assertThat: output.headerErrors
    hasSize: 0
    message: "all step-workflows playbooks have tutorial headers"
