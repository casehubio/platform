name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── PR path: single-reactor build with tests ──────────────────────────
  #
  # The slice aggregators (aggregator-base/slice-a..d/convergence.xml) that
  # this job used to build were moved to casehub-all, so the PR build runs
  # the whole reactor in one invocation, parallelised with -T 1C.

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Bootstrap API dependencies for coordinated releases
        run: python3 .github/scripts/bootstrap-release-apis.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: mvn install -T 1C --batch-mode --fail-at-end -ntp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60

  # ── Push path: single-reactor deploy (no tests) ───────────────────────

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Bootstrap API dependencies for coordinated releases
        run: python3 .github/scripts/bootstrap-release-apis.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          mvn --batch-mode --fail-at-end deploy -DskipTests -ntp 2>&1 | tee /tmp/deploy.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -eq 0 ]; then exit 0; fi
          if grep -q "HTTP Status: 409" /tmp/deploy.log && ! grep -qE "Failures: [1-9]|Errors: [1-9]|COMPILATION ERROR" /tmp/deploy.log; then
            echo "::warning::Some artifacts already deployed (409) — expected for unchanged modules"
            exit 0
          fi
          exit $STATUS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger downstream CI
        if: success()
        run: |
          for repo in parent ledger connectors eidos neural-text casehub-worker work qhorus engine devtown aml clinical claudony; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
