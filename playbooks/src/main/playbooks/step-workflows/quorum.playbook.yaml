# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
meta:
  title: "Quorum"
  description: "Quorum succeeds when N of M named steps have completed — does not require all. Use for \"any 2 of 3\" patterns."
  tags:
    - quorum
    - n-of-m
    - partial completion
    - step-workflows
  level: 4
  layer: step-workflows
  teaches: "waiting for N-of-M branches"
  builds-on: barrier
---
- name: primary
  log: "Primary completed"
- name: secondary
  log: "Secondary completed"
- name: tertiary
  log: "Tertiary completed"
- quorum:
    required: 2
    of: [primary, secondary, tertiary]
- log: "Quorum met — 2 of 3 done"
