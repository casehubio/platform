# yaml-language-server: $schema=https://casehub.io/yaml-core/playbook-document.schema.json
playbook: "1.0"
schema: client
---
meta:
  title: "State Machine"
  description: "Declarative state machine with transitions, guards, and lifecycle handlers. Define states and allowed transitions, then drive the machine through its lifecycle."
  tags:
    - state-machine
    - transitions
    - guards
    - coordination-primitives
  level: 3
  layer: coordination-primitives
  teaches: "named states with guarded transitions"
  builds-on: flag
---
- sm-create order: { states: [draft, submitted, approved, rejected], initial: draft }
- sm-state: "order"
- sm-transition order: { from: draft, to: submitted }
- sm-state: "order"
- sm-transition order: { from: submitted, to: approved }
- sm-state: "order"
