meta:
  title: "Race"
  description: "First-to-complete over arbitrary blocks — two branches execute concurrently, the first to finish wins, the loser is cancelled."
  tags:
    - race
    - first-to-complete
    - cancellation
    - step-workflows
  level: 3
  layer: step-workflows
  teaches: "running branches concurrently where first wins"
  builds-on: parallel
---
- race:
  - block:
    - delay: 200ms
    - log: "Slow branch finished"
  - log: "Fast branch finished"
