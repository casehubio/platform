playbook: "1.0"
schema: client
---
meta:
  title: "Recursive Pattern"
  description: "((A then B) or (A then C))* — nested composition of race, block, and loop. Each iteration races two sequences; the winner's result feeds the next iteration."
  tags:
    - temporal
    - recursive
    - race
    - loop
    - block
    - composition
---
- step: pattern
  race:
    - block:
      - step: read-a1
        log: { message: "Path 1: read A" }
        from: events
      - step: read-b
        log: { message: "Path 1: read B after A" }
        from: events
        timeout: 5s
    - block:
      - step: read-a2
        log: { message: "Path 2: read A" }
        from: events
      - step: read-c
        log: { message: "Path 2: read C after A" }
        from: events
        timeout: 5s
  loop: continuous
  cancel: shutdown
