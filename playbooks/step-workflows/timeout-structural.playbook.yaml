playbook: "1.0"
schema: client
---
playbook: timeout-structural-demo
meta:
  title: "Timeout (structural)"
  description: "Structural timeout wraps child steps — the entire group is aborted if it exceeds the duration. Also shows combining structural and scalar decorators."
  tags:
    - timeout
    - structural
    - block
    - step-workflows
steps:
  # ── structural form: timeout scopes a group ──
  # The duration is a nested key; its value is the steps array.
  # Equivalent to: block: [...] + timeout: "10s"
  - timeout:
      "10s":
        - click: { role: button, name: "A" }
        - click: { role: button, name: "B" }
        - click: { role: button, name: "C" }

  # ── combined: structural decorator + scalar decorators ──
  # forEach is structural (wraps steps), retry and timeout are scalar decorators.
  - forEach:
      "item in items":
        - click: { role: button, name: "${item.name}" }
    retry: 3
    timeout: "30s"
