playbook: "1.0"
schema: client
---
meta:
  title: "Accumulator"
  description: "Reduce-style aggregation — feeds values through a binary operator (sum, product, min, max). The accumulator starts at an identity value and applies the operator for each accumulate call."
  tags:
    - accumulator
    - reduce
    - aggregate
    - coordination-primitives
---
- accumulate total: { op: "sum", value: 10 }
- accumulate total: { op: "sum", value: 25 }
- accumulate total: { op: "sum", value: 7 }
- accumulate-get: "total"
- accumulate max-seen: { op: "max", value: 42 }
- accumulate max-seen: { op: "max", value: 17 }
- accumulate max-seen: { op: "max", value: 99 }
- accumulate-get: "max-seen"
