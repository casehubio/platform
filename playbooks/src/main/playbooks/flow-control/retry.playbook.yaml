playbook: "1.0"
schema: client
---
playbook: retry-demo
meta:
  title: "Retry"
  description: "Retry decorator re-executes a step on failure up to N times. If the executor throws, the scheduler retries before advancing or failing the queue."
  tags:
    - retry
    - decorator
    - flow-control
  level: 2
  layer: flow-control
  teaches: "retrying failed steps with configurable limits"
  builds-on: sequential
---
- click: "A"
  retry: 3
- click: "B"
  retry: { max: 2 }
- click: "C"
