playbook: "1.0"
schema: client
---
playbook: foreach-structural-demo
meta:
  title: "ForEach (structural)"
  description: "Structural for-each wraps child steps — each iteration runs the full group. The expression is part of the YAML key; the steps array is its value."
  tags:
    - for-each
    - structural
    - block
    - step-workflows
  level: 3
  layer: step-workflows
  teaches: "iterating a block per list item"
  builds-on: block-sequential
---
# ── structural form: for-each directly contains steps ──
# "for-each item in items" is the YAML key; the steps array is its value.
# Equivalent to: block: [...] + for-each: "item in items"
- for-each item in items:
    - click: "${item.name}"
    - assert: { expression: "${item.valid}" }
