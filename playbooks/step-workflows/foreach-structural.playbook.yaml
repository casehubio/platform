playbook: "1.0"
schema: client
---
playbook: foreach-structural-demo
meta:
  title: "ForEach (structural)"
  description: "Structural forEach wraps child steps — each iteration runs the full group. The expression is the object key; the steps array is its value."
  tags:
    - forEach
    - structural
    - block
    - step-workflows
steps:
  # ── structural form: forEach directly contains steps ──
  - forEach: "item in items":
      - click: { role: button, name: "${item.name}" }
      - assert: { expression: "${item.valid}" }
